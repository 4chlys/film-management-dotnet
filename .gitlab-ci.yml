image: mcr.microsoft.com/dotnet/sdk:9.0

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/'

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

before_script:
  - 'dotnet restore --packages $NUGET_PACKAGES_DIRECTORY'

stages:
  - build
  - test

build:
  stage: build
  script:
    - 'dotnet build --no-restore'

test:
  stage: test
  script:
    - >
      dotnet test --no-restore
      --logger "junit;LogFilePath=TestResults/junit.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect:"XPlat Code Coverage;Format=cobertura"
      --results-directory Tests/TestResults
    - dotnet tool install dotnet-reportgenerator-globaltool --tool-path tools --version 5.5.4
    - >
      ./tools/reportgenerator
      -reports:"Tests/TestResults/*/coverage.cobertura.xml"
      -reporttypes:Html
      -targetdir:"Tests/TestResults/CoverageReport"
  coverage: '/Total\s*\|\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: 'Tests/TestResults/junit.xml'
      coverage_report:
        coverage_format: cobertura
        path: 'Tests/TestResults/*/coverage.cobertura.xml'
    paths:
      - 'Tests/TestResults/CoverageReport'